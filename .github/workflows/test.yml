name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { node: 18, eslint: 8 }
          - { node: 18, eslint: 9 }
          - { node: 22, eslint: 9 }
          - { node: 22, eslint: 10 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm test
      - if: matrix.node == 22 && matrix.eslint == 9
        run: node --test --experimental-test-coverage --test-coverage-include='lib/**' --test-coverage-include=index.cjs --test-coverage-lines=100 --test-coverage-branches=100 tests/*.test.js
      - if: matrix.node == 22 && matrix.eslint == 9
        run: npm run readme:assets && git diff --exit-code assets

  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Docs page changes when a rule gets new test cases
        run: |
          shared=$(git diff --name-only HEAD^1 HEAD -- index.cjs ':(glob)lib/*.js')
          status=0
          for test in $(git diff --name-only HEAD^1 HEAD -- 'tests/*.test.js'); do
            rule=$(basename "$test" .test.js)
            [ -f "docs/rules/$rule.md" ] || continue
            [ -n "$shared" ] || ! git diff --quiet HEAD^1 HEAD -- "lib/rules/$rule.js" || continue
            git diff -U0 HEAD^1 HEAD -- "$test" | grep -qE '^\+\s*(`|.*\bcode:)' || continue
            git diff --quiet HEAD^1 HEAD -- "docs/rules/$rule.md" || continue
            echo "::error file=$test::$test adds test cases, but docs/rules/$rule.md did not change. Update the page to match what the rule now does."
            status=1
          done
          exit $status
