name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { node: 18, eslint: 9 }
          - { node: 22, eslint: 9 }
          - { node: 22, eslint: 10 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint }}
      - run: npm test
      - if: matrix.node == 22 && matrix.eslint == 9
        run: npm run readme:assets && git diff --exit-code assets
