<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700"><style>.l{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;white-space:pre;fill:#1f2328}.p{fill:#15803d;font-weight:700}.c{font-weight:700}.h{text-decoration:underline}.d{fill:#656d76}.e{fill:#dc2626;font-weight:700}.w{fill:#b45309;font-weight:700}.m{fill:#656d76;font-style:italic}.ttl{font:600 12px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#656d76}@keyframes a0{0%,6%{opacity:0}7.5%,95%{opacity:1}98%,100%{opacity:0}}@keyframes a2{0%,52%{opacity:0}53.5%,95%{opacity:1}98%,100%{opacity:0}}@keyframes a3{0%,64%{opacity:0}65.5%,95%{opacity:1}98%,100%{opacity:0}}@keyframes a4{0%,72%{opacity:0}73.5%,95%{opacity:1}98%,100%{opacity:0}}</style><rect x="0.5" y="0.5" width="899" height="699" rx="10" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 36V10.5a10 10 0 0 1 10-10h879a10 10 0 0 1 10 10V36z" fill="#f6f8fa"/><path d="M0.5 36H899.5" stroke="#d0d7de"/><circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/><text class="ttl" x="450" y="22" text-anchor="middle">my-app</text><text class="l" x="24" y="64"><tspan class="p">$ </tspan><tspan class="c">npx eslint src</tspan></text><g style="opacity:0;animation:a0 16s infinite"><text class="l" x="24" y="100"><tspan class="h">src/components/DeleteButton.jsx</tspan></text><text class="l" x="24" y="118"><tspan class="d">  4:3   </tspan><tspan class="e">error     </tspan><tspan class="o">This button shows only an icon and has no name. An agent sees a button with no name and</tspan></text><text class="l" x="24" y="136"><tspan class="o">                  cannot tell what it does. Add aria-label with what it does, e.g. aria-label="Close"</tspan></text><text class="l" x="24" y="154"><tspan class="d">                  agentic-dom/icon-button-has-name</tspan></text><text class="l" x="24" y="190"><tspan class="h">src/components/Filters.jsx</tspan></text><text class="l" x="24" y="208"><tspan class="d">  8:7   </tspan><tspan class="w">warning   </tspan><tspan class="o">This button shows and hides content but never says whether it is shown. An agent clicks it</tspan></text><text class="l" x="24" y="226"><tspan class="o">                  and cannot tell if it opened or closed. Add aria-expanded={open}, or aria-pressed for an</tspan></text><text class="l" x="24" y="244"><tspan class="o">                  on/off button</tspan></text><text class="l" x="24" y="262"><tspan class="d">                  agentic-dom/toggle-has-state</tspan></text><text class="l" x="24" y="298"><tspan class="h">src/components/PayButton.jsx</tspan></text><text class="l" x="24" y="316"><tspan class="d">  2:11  </tspan><tspan class="w">warning   </tspan><tspan class="o">This button can be disabled without saying why. An agent sees a dead button and cannot tell</tspan></text><text class="l" x="24" y="334"><tspan class="o">                  what to fix. Show the reason as text and point aria-describedby at it</tspan></text><text class="l" x="24" y="352"><tspan class="d">                  agentic-dom/disabled-has-reason</tspan></text><text class="l" x="24" y="388"><tspan class="h">src/components/TeamList.jsx</tspan></text><text class="l" x="24" y="406"><tspan class="d">  4:19  </tspan><tspan class="w">warning   </tspan><tspan class="o">Every row renders a button named "Edit". An agent sees many identical buttons and cannot tell</tspan></text><text class="l" x="24" y="424"><tspan class="o">                  which row each one acts on. Add the row to its name, e.g. aria-label={`Edit ${item.name}`}</tspan></text><text class="l" x="24" y="442"><tspan class="d">                  agentic-dom/repeated-action-context</tspan></text><text class="l" x="24" y="478"><tspan class="h">src/components/ViewPicker.jsx</tspan></text><text class="l" x="24" y="496"><tspan class="d">  6:5   </tspan><tspan class="w">warning   </tspan><tspan class="o">This button looks selected when view === v but never says so. An agent sees every option</tspan></text><text class="l" x="24" y="514"><tspan class="o">                  alike and cannot tell which one is chosen. Add aria-pressed={view === v}, or aria-selected</tspan></text><text class="l" x="24" y="532"><tspan class="o">                  with role="tab" for a tab</tspan></text><text class="l" x="24" y="550"><tspan class="d">                  agentic-dom/selected-has-state</tspan></text><text class="l" x="24" y="586"><tspan class="e">✖ 5 problems (1 error, 4 warnings)</tspan></text></g><g style="opacity:0;animation:a2 16s infinite"><text class="l" x="24" y="622"><tspan class="m"># Your coding agent applies each message: aria-label and aria-describedby.</tspan></text></g><g style="opacity:0;animation:a3 16s infinite"><text class="l" x="24" y="640"><tspan class="p">$ </tspan><tspan class="c">npx eslint src</tspan></text></g><g style="opacity:0;animation:a4 16s infinite"><text class="l" x="24" y="658"><tspan class="m"># No output. Every file passes.</tspan></text></g></svg>
